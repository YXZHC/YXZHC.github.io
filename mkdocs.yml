site_name: YX的小站
theme:
  # name: readthedocs
  # name: mkdocs
  name: material
  favicon: images/ico/ico.jpg
  language: zh

  features:
    - navigation.tabs
    - navigation.tabs.sticky

  palette: 
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: 切换到暗色模式

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色模式

nav: 
  - Home:
      - Home: index.md
      - C++: C++/index.md
  - 关于我: about.md


