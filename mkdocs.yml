site_name: YX的小站
theme:
  # name: readthedocs
  # name: mkdocs
  name: material
  favicon: images/ico/ico.jpg
  language: zh

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy #代码复制

  palette: 
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: 切换到暗色模式

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色模式

nav: 
  - Home:
    - Home: index.md

  - 自制工具集:
    - 概述: SelfTools/index.md
    - 答题系统: SelfTools/answering_quiz.md

  - ROS2:
      - ROS2: ROS2/index.md
      - Node: ROS2/Node.md
      - Topic: 
        - 概述: ROS2/Topic.md
        - 订阅: ROS2/Topic/Subscriber.md
        - 发布: ROS2/Topic/Publisher.md

      - Service: ROS2/Service.md
      - Action: ROS2/Action.md

  
  - C++:
      - C++: C++/index.md
  
  - Python:
      - Python: Python/index.md

  - Linux:
      - Linux: Linux/index.md

  - LabVIEW:
      - LabVIEW: LabVIEW/index.md

  - 关于我: about.md



extra:
  generator: true  #删除页脚显示“使用 MkDocs 材料制造”
  social:
    - icon: fontawesome/brands/bilibili
      link: https://space.bilibili.com/489593500?spm_id_from=333.1007.0.0



markdown_extensions:
  - mermaid2
  - abbr
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - md_in_html
  - pymdownx.arithmatex:  # latex支持
      generic: true
  - toc:
      permalink: true # 固定标题位置为当前位置
  - pymdownx.highlight: # 代码块高亮
      anchor_linenums: true
      # linenums: true # 显示行号
      # auto_title: true # 显示编程语言名称
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.superfences # 代码块高亮插件
  - meta # 支持Markdown文件上方自定义标题标签等